# 黄金查询集示例。
#
# 用法:
#   kb index --global ARCHITECTURE.md
#   kb eval --set eval/golden.example.toml --k 5
#
# 真实与随机:用例顺序每次按 seed 打乱,`--sample N` 再随机抽 N 条。
#   kb eval --sample 10                 # 从这份集合里随机抽 10 条,种子打印在结果里
#   kb eval --sample 10 --seed 7        # 复现同一批
#   kb eval                            # 全部跑(顺序仍随机)
# 黄金集写错(collection 不存在、期望文件不在库里)时 `kb eval` 先预检并返回退出码 6,
# 无效用例不会混进命中率的分母;确实要按剩下的用例算分才加 `--allow-invalid`。
#
# 一份好的黄金集怎么攒:
#   1) 用例从真实查询里来(audit 表里的 search_knowledge 原话),不要照着检索结果编;
#   2) 按集合分层再随机抽,几条大集合撑满、小集合一条没有,量出来的是那几个大集合的水平;
#   3) 抽到哪条文件就照它的正文写查询 —— 先看文件再写题,反过来就是拿答案凑题目;
#   4) `expect` 列真答案(同一份内容的多个拷贝、文档与实现同等有效时都列上),不是列「前几名」;
#   5) 留几条现在确实查不到的难例:全是 1.0 的集合量不出调参有没有用。
#
# 黄金集文件自己不要在索引里 —— 它的正文就是查询原话,检索时会「自己命中自己」。
# 真在索引里的话 `kb eval` 会自动剔除命中的它(输出里报「有 N 条结果命中它本身」),
# 但更干净的做法是把它放在索引根之外,或加进项目的排除规则。
#
# 每条 case:
#   query            —— 查询串(可带 kind:/path: 等前缀)
#   collection       —— 在哪个 collection 里检索
#   expect           —— 命中条件列表(任一满足即算命中):
#     source         —— 命中记录的 source 必须等于它
#     title_contains —— 命中记录的 title 必须包含它(可选)

[[case]]
query = "双哈希增量索引怎么判断是否需要重新嵌入"
collection = "_global"
expect = [{ source = "ARCHITECTURE.md", title_contains = "14.1" }]

