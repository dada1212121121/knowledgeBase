name: 功能建议
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述场景与痛点,而不是直接给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 可选。说明你希望怎么解决、有没有替代方案。
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 涉及前端 / 守护进程 / 检索 / 部署 / 文档?是否破坏兼容?
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 issue 与文档,没有重复
          required: true
