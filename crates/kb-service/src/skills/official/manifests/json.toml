type = "plugin"
name = "official-json"
version = "0.1.0"
api_version = 1
description = "按顶层键 / 数组项切开 JSON / JSONC,大配置文件不再是一整块"

[index]
include = ["**/*.json", "**/*.jsonc"]
exclude = ["**/node_modules/**", "**/dist/**", "**/coverage/**", "**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/*.min.json"]
lang = "json"
tags = ["json", "config"]
priority = 100

[exec]
command = "python3"
args = ["plugin.py", "json"]
hooks = ["chunk"]
timeout_ms = 20000
max_output_bytes = 16777216
