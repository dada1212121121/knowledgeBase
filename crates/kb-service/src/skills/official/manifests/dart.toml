type = "plugin"
name = "official-dart"
version = "0.1.0"
api_version = 1
description = "按 Dart / Flutter 的顶层声明切块,类和方法不会被拆散"

[index]
include = ["**/*.dart"]
exclude = ["**/.dart_tool/**", "**/build/**", "**/ios/Pods/**", "**/android/.gradle/**"]
lang = "dart"
tags = ["dart", "flutter"]
priority = 100

[exec]
command = "python3"
args = ["plugin.py", "dart"]
hooks = ["chunk"]
timeout_ms = 20000
max_output_bytes = 16777216
