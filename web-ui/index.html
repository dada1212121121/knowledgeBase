<!doctype html>
<html lang="zh-CN" data-theme="dark" data-accent="indigo" data-layout="sidebar" data-width="fluid" data-density="default" data-radius="default" data-font="m" data-motion="mac">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover:内容铺到刘海 / 圆角下面,由 env(safe-area-inset-*) 在外壳里让出;高度一律用 dvh / visualViewport,不用 100vh -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>knowledgeBase</title>
    <!-- PWA():可安装到桌面 / 主屏幕。主题色的初值按深色写,appearance-boot.js 与外观设置会按实际主题改它 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#08080a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="知识库" />
    <!-- black:状态栏是实心黑条、内容从它下面开始;black-translucent 在浅色主题下白字压在浅色页面上看不见 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script src="/appearance-boot.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
