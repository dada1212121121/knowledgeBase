# kbd 与核显嵌入 sidecar 的依赖顺序(放到 /etc/systemd/system/kbd.service.d/30-embed-sidecar.conf)。
# 配套 kb-embed-sidecar.service(同目录):embed.backend = "http" 时 kbd 启动即做一次嵌入预热,sidecar 必须已经在监听。
# 回滚:删掉这个文件和 kb-embed-sidecar.service,config.toml 里 embed.backend 改回 fastembed(先 kb migrate 回去,见 )。
[Unit]
# Wants 而不是 Requires:sidecar 自动重启时不要把 kbd 一起带停
Wants=kb-embed-sidecar.service
After=kb-embed-sidecar.service
