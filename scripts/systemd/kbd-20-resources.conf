# kbd 的资源让路与上限(放到 /etc/systemd/system/kbd.service.d/20-resources.conf)。
# 目的:批量索引/向量化是长时间满载的后台活,同机还有 docker 里的业务服务,
# 后台活必须在别人忙的时候让路、在机器空闲时照常跑满;并且出 bug 时有上限,不会把整机拖死。
# 回滚时删掉这个文件再 systemctl daemon-reload && systemctl restart kbd。
[Service]
# 调度优先级低一档:和业务容器抢 CPU 时让给它们(空闲时不影响速度)
Nice=10
CPUWeight=50
# 磁盘读写也让路;向量库合并/清理时会有集中写盘
IOWeight=50
# 软上限:超过就被内核回收页缓存并限速,不会直接杀进程(MemoryMax 不设,避免索引中途被 OOM 杀掉)
MemoryHigh=16G
# 保护区:实测 2.3G 被换出,冷查询要付 2.9 s p95 —— 那是别人的构建(5 × rust-lld 约 18G)
# 把机器压满后,MemoryHigh 只能限速、不能保护工作集。给一份不可回收的下限;
# 这不是「占着不用」:内核只在内存紧张时才兑现它,空闲时该给别人的照给。
MemoryMin=2G
